<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi 3: Bisnis Jasa</title>
<style>
:root{--bg1:#dff5f1;--bg2:#fdf0d2;--ink:#17325f;--cream:#fffaf0;--acc:#1e9b8f;--blue:#2457b8;--gold:#f2b632;--ok:#2e9b4f;--bad:#d44a3a;--shadow:rgba(20,50,60,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#10282a;--bg2:#2d2615;--ink:#eef4f2;--cream:#212c2e;--blue:#4a80e0}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2));min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.badge{display:inline-block;background:var(--acc);color:#fff;border:3px solid var(--gold);border-radius:14px;padding:6px 14px;font-weight:800;line-height:1.1;box-shadow:0 3px 0 var(--shadow)}
.badge small{display:block;font-weight:600;font-size:.7rem}
.hero{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.boy{font-size:3.4rem;line-height:1}
.box{background:var(--cream);border:3px solid var(--acc);border-radius:18px;padding:10px 14px;font-size:.92rem}
.box b{color:var(--acc)}
.steps{display:flex;gap:6px;margin:14px 0 8px;font-size:.78rem;font-weight:800}
.steps span{flex:1;text-align:center;padding:6px 4px;border-radius:10px;background:rgba(30,155,143,.15)}
.steps .on{background:var(--acc);color:#fff}
.steps .dn{background:var(--ok);color:#fff}
.s,.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:12px;border:2px solid var(--gold);background:var(--cream);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.s.del{text-decoration:line-through;opacity:.55;border-color:var(--bad);background:rgba(212,74,58,.15)}
.s.pl{background:rgba(46,155,79,.2);border-color:var(--ok);cursor:default}
.opt{border-color:var(--blue)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.qc{background:var(--cream);border:3px solid var(--blue);border-radius:14px;padding:10px 12px;margin:8px 0}
.qc.dn{border-color:var(--ok)}
.qc p{margin:0 0 4px;font-weight:700;font-size:.9rem}
.num{display:inline-block;background:var(--ok);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;text-align:center;font-weight:800;margin-right:6px}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:.9rem;background:rgba(30,155,143,.15)}
.fb.ok{background:rgba(46,155,79,.2)}
.fb.no{background:rgba(212,74,58,.2)}
.btn{margin-top:10px;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.doc h3{margin:10px 0 2px;color:var(--acc)}
.doc p,.doc li{font-size:.9rem;margin:2px 0}
.stars{font-size:1.6rem;letter-spacing:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge"><small>Misi 3</small>Bisnis Jasa</div>
  <div class="hero">
    <div class="boy">🧒</div>
    <div class="box">🧺 Selamat datang di <b>Bisnis Jasa!</b> Pemilik laundry membuat SOP, tetapi hasilnya masih berantakan. Jadilah penyunting dan rapikan teks prosedurnya dalam 3 tahap!</div>
  </div>
  <div class="steps" id="steps"></div>
  <div id="stage"></div>
  <div class="fb" id="fb">Mulai dari Tahap 1.</div>
</div>
<script>
var D=[
{f:"Prosedur ini bertujuan memastikan pakaian pelanggan bersih, wangi, dan tidak rusak."},
{f:"Siapkan mesin cuci, deterjen cair, pelembut, dan keranjang pakaian."},
{f:"Pisahkan pakaian putih dari pakaian berwarna.",m:"Putih sama berwarna dipisah-pisahin dulu ya."},
{f:"Jika ada noda membandel, oleskan pemutih khusus noda selama 10 menit sebelum dicuci."},
{f:"Masukkan pakaian ke mesin cuci, lalu tuangkan deterjen sesuai takaran.",m:"Masukin baju ke mesin trus tuang deterjen secukupnya aja."},
{f:"Setelah pencucian selesai, jemur pakaian di tempat teduh hingga kering.",m:"Habis dicuci, jemur aja bajunya di mana aja sampai kering."},
{f:"Dengan demikian, pakaian pelanggan bersih, wangi, dan siap dikemas."}
];
var J=["Menurut saya, laundry adalah usaha paling gampang dan pasti untung besar.","Pelanggan kami kebanyakan mahasiswa yang tinggal di kos."];
var S1=[];D.forEach(function(d,i){S1.push({t:d.m||d.f,j:0})});J.forEach(function(t){S1.push({t:t,j:1})});
function shuf(a){return a.sort(function(){return Math.random()-.5})}
shuf(S1);
var Q2=[
{i:2,o:["Kamu harus pisahin pakaian putih dan berwarna.","Pisahkan pakaian putih dari pakaian berwarna.","Pakaian putih dan berwarna dipisah-pisahkan saja."],a:1,e:"Langkah memakai kalimat perintah baku: verba dasar + akhiran -kan (pisahkan)."},
{i:4,o:["Memasukkan pakaian ke mesin cuci dan menuangkan deterjen.","Pakaian dimasukkan ke mesin cuci oleh karyawan, deterjen sedikit.","Masukkan pakaian ke mesin cuci, lalu tuangkan deterjen sesuai takaran."],a:2,e:"Perintah baku, urutan jelas dengan “lalu”, dan ukuran jelas (sesuai takaran)."},
{i:5,o:["Setelah pencucian selesai, jemur pakaian di tempat teduh hingga kering.","Jemurlah baju di mana saja karena sampai kering.","Pakaian yang sudah kering dijemur setelah selesai dicuci."],a:0,e:"Konjungsi temporal “setelah” dan keterangan tempat/batas (di tempat teduh, hingga kering) membuat langkah jelas."}
];
var O3=shuf(D.map(function(_,i){return i}));
var st=1,errs=0,del={},ok2={},pos=0;
var fb=document.getElementById("fb");
function say(c,h){fb.className="fb "+c;fb.innerHTML=h}
function steps(){var n=["1 Hapus","2 Perbaiki","3 Urutkan"],h="";n.forEach(function(x,k){h+='<span class="'+(st===k+1?"on":st>k+1?"dn":"")+'">'+x+'</span>'});document.getElementById("steps").innerHTML=h}
function R(){
  steps();var h="",g=document.getElementById("stage");
  if(st===1){
    h+='<div class="box"><b>Tahap 1: Hapus.</b> Ketuk kalimat yang <b>tidak seharusnya</b> ada dalam teks prosedur (jangan hiraukan bahasa tidak baku dulu). Lalu tekan Periksa.</div>';
    S1.forEach(function(s,i){h+='<button class="s'+(del[i]?" del":"")+'" onclick="t1('+i+')">'+s.t+'</button>'});
    h+='<button class="btn" onclick="c1()">Periksa</button>';
  }else if(st===2){
    h+='<div class="box"><b>Tahap 2: Perbaiki.</b> Pilih perbaikan yang paling tepat untuk tiap kalimat tidak baku.</div>';
    Q2.forEach(function(q,j){
      h+='<div class="qc'+(ok2[j]?" dn":"")+'" id="q'+j+'"><p>“'+D[q.i].m+'”</p>';
      q.o.forEach(function(o,k){h+='<button class="opt'+(ok2[j]&&k===q.a?" right":"")+'" '+(ok2[j]?"disabled":"")+' onclick="a2('+j+','+k+',this)">'+o+'</button>'});
      h+='</div>';
    });
  }else if(st===3){
    h+='<div class="box"><b>Tahap 3: Urutkan.</b> Ketuk kalimat satu per satu dari bagian paling awal sampai paling akhir. Ingat struktur: tujuan, bahan dan alat, langkah-langkah, penutup.</div>';
    O3.forEach(function(i){var p=i<pos;h+='<button class="s'+(p?" pl":"")+'" id="o'+i+'" '+(p?"":'onclick="a3('+i+')"')+'>'+(p?'<span class="num">'+(i+1)+'</span>':"")+D[i].f+'</button>'});
  }else{
    var s=errs<=3?3:errs<=7?2:1;
    h+='<div class="box doc"><div class="stars">'+"★".repeat(s)+"☆".repeat(3-s)+'</div><b>Teks prosedur hasil suntinganmu:</b><h3>Prosedur Mencuci Pakaian Kiloan</h3><h3>Tujuan</h3><p>'+D[0].f+'</p><h3>Bahan dan Alat</h3><p>'+D[1].f+'</p><h3>Langkah-langkah</h3><ol start="1"><li>'+D[2].f+'</li><li>'+D[3].f+'</li><li>'+D[4].f+'</li><li>'+D[5].f+'</li></ol><h3>Penutup</h3><p>'+D[6].f+'</p></div>';
    h+='<button class="btn" onclick="alert(\'Selamat! Semua misi selesai. Menuju Exit Gate…\')">🏁 Menuju Exit Gate</button>';
  }
  g.innerHTML=h;
}
function t1(i){del[i]=!del[i];R()}
function c1(){
  var w=0,m=0;S1.forEach(function(s,i){if(del[i]&&!s.j)w++;if(!del[i]&&s.j)m++});
  if(!w&&!m){st=2;say("ok","✅ <b>Tepat!</b> Opini penulis dan informasi yang tidak berkaitan dengan langkah kerja tidak termasuk teks prosedur.");R()}
  else{errs++;say("no","❌ <b>Belum tepat.</b> "+(w?w+" kalimat yang kamu hapus sebenarnya masih diperlukan. ":"")+(m?m+" kalimat yang tidak relevan belum kamu hapus.":""))}
}
function a2(j,k,el){
  var q=Q2[j];
  if(k===q.a){ok2[j]=1;say("ok","✅ <b>Benar!</b> "+q.e);if(Object.keys(ok2).length===Q2.length){st=3;say("ok","✅ Semua kalimat sudah baku. Sekarang susun urutannya!")}R()}
  else{errs++;el.classList.add("wrong");el.disabled=true;say("no","❌ <b>Belum tepat.</b> Perhatikan kebakuan kata, kalimat perintah, dan kejelasan langkahnya.")}
}
function a3(i){
  if(i===pos){pos++;say("ok","✅ Urutan tepat!");if(pos===D.length){st=4;say("ok","🎉 <b>Hebat!</b> Teks prosedurmu sudah rapi dan runtut. Kamu menyelesaikan semua misi dengan "+errs+" kesalahan.")}R()}
  else{errs++;var e=document.getElementById("o"+i);e.classList.add("shake");say("no","❌ <b>Belum urut.</b> Pikirkan lagi: bagian apa yang harus muncul lebih dulu dalam teks prosedur?")}
}
R();
</script>
</body>
</html>
